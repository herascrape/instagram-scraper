[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[project]
name = "instagram-scrapers"
dynamic = ["version", "readme"]
description = "Instagram scraper CLI: fake follower checker, giveaway comment picker, account audit and follower tracker. No login, no ban."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "herascrape" }]
keywords = [
    "instagram scraper",
    "instagram fake follower checker",
    "instagram giveaway picker",
    "instagram comment picker",
    "instagram audit",
    "instagram engagement rate",
    "instagram unfollowers",
    "instagram private api",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "herascrape>=0.1.5",
    "typer>=0.15",
    "rich>=13",
    "pydantic>=2.7",
    "platformdirs>=4",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
instagram-scraper = "instagram_scrapers.cli:main"

[project.urls]
Homepage = "https://herascrape.com"
Repository = "https://github.com/herascrape/instagram-scraper"
Issues = "https://github.com/herascrape/instagram-scraper/issues"
"API client" = "https://github.com/herascrape/herascrape"

# Dev tooling lives in a PEP 735 group so `uv run`/`uv sync` install it by default.
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff==0.15.10",
    "pyright==1.1.414",
]

[tool.uv]
package = true

[tool.hatch.version]
path = "instagram_scrapers/__init__.py"

# PyPI gets the README with PyPI link tags and absolute links.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = "utm_source=github"
replacement = "utm_source=pypi"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(#'
replacement = "](https://github.com/herascrape/instagram-scraper#"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://)([^)]+)\)'
replacement = '](https://github.com/herascrape/instagram-scraper/blob/main/\1)'

[tool.hatch.build.targets.sdist]
include = ["/instagram_scrapers", "/README.md"]

[tool.hatch.build.targets.wheel]
packages = ["instagram_scrapers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits the real api.herascrape.com (needs HERASCRAPE_API_KEY)",
]

[tool.pyright]
include = ["instagram_scrapers", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
